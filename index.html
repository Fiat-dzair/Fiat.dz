<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل إلى صفحة التحميل</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }
        .logo {
            color: #ff2b43;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
        }
        .message {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #ff2b43;
            color: #ffffff;
            border: none;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 43, 67, 0.3);
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #e0243b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">FIAT</div>
        
        <div class="message">
            لتحويلك لموقع التحميل اضغط على تحويل
        </div>

        <a href="https://siiir-tv.vercel.app" class="btn">تحويل</a>
    </div>

</body>
</html>
